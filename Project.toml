[compat]
# The floors are the versions that first carry what this package needs, not the current
# releases: `noise`/`noisedims` (GeometricBase 0.14.10), the concrete noise processes
# (GeometricEquations 0.21.3) and `default_extrapolation(method)` (GeometricIntegratorsBase
# 0.6.5). CI's `min` matrix entry resolves exactly these, so a floor left at the major
# version would test a combination that cannot work.
GeometricBase = "0.14.10"
GeometricEquations = "0.21.3"
GeometricIntegrators = "0.18"
GeometricIntegratorsBase = "0.6.5"
GeometricProblems = "0.9"
